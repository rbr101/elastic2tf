# Configuratie voor: ./elastic2tf.py --fetch
# Kopieer naar elastic2tf.ini (of ~/.config/elastic2tf.ini) en pas aan.
# Zet hier GEEN wachtwoord in: dat wordt bij het starten in de terminal gevraagd.
# Hebben Elasticsearch en Kibana dezelfde username, dan wordt het maar één keer gevraagd.

[elasticsearch]
url      = https://elasticsearch.example.local:9200
username = elastic
# ca_cert    = /pad/naar/ca.crt   # eigen CA (bijv. ECK: secret <naam>-es-http-certs-public)
# verify_ssl = true               # alleen voor testen op false zetten
# timeout    = 60                 # seconden per call

[kibana]
url      = https://kibana.example.local:5601   # inclusief eventueel basePath
username = elastic
# ca_cert    = /pad/naar/ca.crt
# verify_ssl = true

[fetch]
# Wat ophalen: types (zie --list-types), Terraform-resources en/of Dev Tools-calls.
# Komma's of één per regel; een regel met een call blijft heel. Default: alles behalve
# cluster_settings. Wat na --fetch op de commandline staat gaat voor.
# types = ilm, index_template, elasticstack_kibana_alerting_rule
#     GET _security/role/lezer
#     POST kbn:/api/saved_objects/_export {"objects":[{"type":"dashboard","id":"abc"}]}

# Kibana spaces waaruit connectors, rules, data views en saved objects komen
spaces = default

# Pattern voor de data streams -> data views
datastream_pattern = logs-*

# Alleen deze objecten omzetten (zie --items): 'naam' voor alle types, 'type:naam' voor één type.
# Het type geldt ook voor de namen erna (tot het volgende type:). Komma's of één per regel, globs mogen. --items op de commandline gaat voor.
# Staan hier alleen 'type:naam'-items en is er geen 'types', dan worden alleen die types opgehaald.
# items = ingest_pipeline:logs-app, logs-web*
#     ilm:logs-*
#     alerting_rule:CPU*

# Saved object types voor de export (gerefereerde objecten gaan automatisch mee)
saved_object_types = dashboard
